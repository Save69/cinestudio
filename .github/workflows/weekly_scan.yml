name: Weekly CineStudio Auto-Scan

on:
  # Avvio automatico del giovedì DISATTIVATO (V63, 08/10/2026): lo script non verifica la
  # disponibilità su JustWatch e reinseriva film già presenti con piattaforme errate.
  # schedule:
  #   - cron: '0 17 * * 4'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un click da GitHub

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (Verifica Sintattica)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Esegui Scansione Settimanale
        run: python scripts/weekly_cinestudio_updater.py

      - name: Commit e Push su GitHub (Trigger automatico Netlify)
        run: |
          git config --local user.email "bot@cinestudio.local"
          git config --local user.name "CineStudio Weekly Bot"
          if [ -n "$(git status --porcelain CineStudio.html index.html)" ]; then
            git add CineStudio.html index.html
            git commit -m "chore(bot): scansione automatica novità giovedì"
            git push origin main
            echo "Nuove gemme pubblicate! Netlify sta aggiornando l'app sul cellulare."
          else
            echo "Catalogo già al massimo della freschezza: nessuna modifica necessaria."
          fi
